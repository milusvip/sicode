<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图表 Demo</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2230;
    --line: #262d3a;
    --text: #e6edf3;
    --muted: #8b96a8;
    --a: #5b9cff;
    --a-2: #8f7bff;
    --b: #35d0a5;
    --c: #ffb454;
    --d: #ff6b8b;
    --radius: 12px;
    --fs: clamp(11px, 1.6vw, 13px);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa;
      --panel: #ffffff;
      --panel-2: #f7f9fc;
      --line: #e3e8f0;
      --text: #1a2029;
      --muted: #6b7688;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: var(--fs)/1.5 ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 14px;
  }
  .dash { max-width: 900px; margin: 0 auto; display: grid; gap: 12px; }

  .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .head h1 { font-size: 1.15rem; margin: 0; letter-spacing: .2px; }
  .head .sub { color: var(--muted); font-size: .85em; }
  .head .pill {
    margin-left: auto; color: var(--b); background: color-mix(in srgb, var(--b) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--b) 35%, transparent);
    border-radius: 999px; padding: 2px 10px; font-size: .78em; white-space: nowrap;
  }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; display: grid; gap: 2px;
  }
  .kpi .k { color: var(--muted); font-size: .78em; }
  .kpi .v { font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .t { font-size: .76em; color: var(--muted); }
  .kpi .t.up { color: var(--b); }
  .kpi .t.down { color: var(--d); }

  .grid { display: grid; gap: 10px; grid-template-columns: 1.55fr 1fr; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 12px 8px; position: relative; min-width: 0;
  }
  .card h2 { margin: 0 0 8px; font-size: .86rem; font-weight: 600; color: var(--text); }
  .card h2 span { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: .85em; }
  .card svg { display: block; width: 100%; height: auto; overflow: visible; }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; color: var(--muted); font-size: .8em; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; }

  .grid-line { stroke: var(--line); stroke-width: 1; }
  .axis-text { fill: var(--muted); font-size: 10px; }
  .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fade { opacity: 0; animation: fade .6s ease .5s forwards; }
  @keyframes fade { to { opacity: 1; } }

  #tip {
    position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -110%);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; font-size: .78em; white-space: nowrap; transition: opacity .12s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,.28); z-index: 3;
  }
  #tip b { font-weight: 600; }
  #tip .row { display: flex; align-items: center; gap: 5px; color: var(--muted); }
  #tip .row span:last-child { color: var(--text); margin-left: auto; font-variant-numeric: tabular-nums; }

  .bars { display: flex; align-items: flex-end; gap: clamp(4px, 1.5vw, 10px); height: 118px; padding-top: 4px; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; min-width: 0; }
  .bar u {
    display: block; width: 100%; border-radius: 5px 5px 3px 3px; height: 0;
    background: linear-gradient(180deg, var(--a), color-mix(in srgb, var(--a) 45%, transparent));
    transition: height .8s cubic-bezier(.4,0,.2,1), filter .15s ease;
  }
  .bar:nth-child(2n) u { background: linear-gradient(180deg, var(--a-2), color-mix(in srgb, var(--a-2) 45%, transparent)); }
  .bar:hover u { filter: brightness(1.25); }
  .bar em { font-style: normal; color: var(--muted); font-size: .7em; white-space: nowrap; }

  .donut-wrap { display: flex; align-items: center; gap: 10px; }
  .donut-wrap svg { width: min(42vw, 132px); flex: 0 0 auto; }
  .donut-list { display: grid; gap: 5px; font-size: .8em; min-width: 0; flex: 1; }
  .donut-list div { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .donut-list b { color: var(--text); margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .donut center { fill: var(--text); }
  .ring { transition: transform .2s ease; transform-origin: 60px 60px; cursor: default; }
  .ring:hover { transform: scale(1.04); }
  .foot { color: var(--muted); font-size: .74em; text-align: right; padding: 2px 2px 0; }
</style>
</head>
<body>
<main class="dash">
  <div class="head">
    <h1>流量概览</h1>
    <span class="sub">近 12 个月 · 示例数据</span>
    <span class="pill">实时</span>
  </div>

  <section class="kpis">
    <div class="kpi"><span class="k">总访问</span><span class="v" data-count="1284000" data-suffix="">0</span><span class="t up">▲ 12.4% 环比</span></div>
    <div class="kpi"><span class="k">转化率</span><span class="v" data-count="3.82" data-suffix="%" data-dec="2">0</span><span class="t up">▲ 0.4pt</span></div>
    <div class="kpi"><span class="k">平均停留</span><span class="v">4m32s</span><span class="t down">▼ 6s</span></div>
    <div class="kpi"><span class="k">跳出率</span><span class="v" data-count="38.6" data-suffix="%" data-dec="1">0</span><span class="t up">▼ 2.1pt</span></div>
  </section>

  <section class="grid">
    <article class="card" id="lineCard">
      <h2>访问量趋势<span>按周聚合</span></h2>
      <div id="lineHost"></div>
      <div class="legend">
        <span><i style="background:var(--a)"></i>访问量</span>
        <span><i style="background:var(--b)"></i>独立访客</span>
      </div>
      <div id="tip" role="tooltip"></div>
    </article>

    <article class="card">
      <h2>流量来源</h2>
      <div class="donut-wrap">
        <svg viewBox="0 0 120 120" aria-label="流量来源占比">
          <g id="rings"></g>
          <circle cx="60" cy="60" r="34" fill="none" class="grid-line"></circle>
          <text x="60" y="56" text-anchor="middle" font-size="16" font-weight="600" class="donut" id="donutTotal">0</text>
          <text x="60" y="70" text-anchor="middle" font-size="8" class="axis-text">总会话</text>
        </svg>
        <div class="donut-list" id="donutList"></div>
      </div>
    </article>

    <article class="card">
      <h2>每日活跃<span>最近 7 天</span></h2>
      <div class="bars" id="bars"></div>
      <div class="foot">峰值 周二 · 4.1k</div>
    </article>

    <article class="card">
      <h2>转化漏斗</h2>
      <div class="bars" id="funnel" style="height:104px"></div>
      <div class="foot">曝光 → 点击 → 加购 → 下单</div>
    </article>
  </section>
</main>

<script>
const svgNS = "http://www.w3.org/2000/svg";
const el = (n, a = {}) => { const e = document.createElementNS(svgNS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

/* ---------- 折线 / 面积图 ---------- */
const W = 640, H = 210, P = { t: 14, r: 14, b: 22, l: 34 };
const months = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const sA = [32, 45, 38, 61, 55, 72, 68, 84, 79, 92, 88, 105];
const sB = [18, 26, 31, 29, 42, 39, 51, 47, 58, 63, 71, 76];
const maxY = 120;
const x = (i) => P.l + (i * (W - P.l - P.r)) / (months.length - 1);
const y = (v) => H - P.b - (v / maxY) * (H - P.t - P.b);

const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
for (let v = 0; v <= maxY; v += 30) {
  svg.append(el("line", { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v), class: "grid-line" }));
  const t = el("text", { x: P.l - 6, y: y(v) + 3, "text-anchor": "end", class: "axis-text" });
  t.textContent = v ? v + "k" : "0";
  svg.append(t);
}
months.forEach((m, i) => {
  if (i % 2) return;
  const t = el("text", { x: x(i), y: H - 6, "text-anchor": "middle", class: "axis-text" });
  t.textContent = m;
  svg.append(t);
});

const line = (data) => data.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
const gid = "grad";
const defs = el("defs");
const lg = el("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
lg.append(el("stop", { offset: "0%", "stop-color": "var(--a)", "stop-opacity": .34 }));
lg.append(el("stop", { offset: "100%", "stop-color": "var(--a)", "stop-opacity": 0 }));
defs.append(lg); svg.append(defs);

svg.append(el("path", { d: `${line(sA)} L${x(sA.length - 1)},${H - P.b} L${x(0)},${H - P.b} Z`, fill: `url(#${gid})`, class: "fade" }));

const pA = el("path", { d: line(sA), fill: "none", stroke: "var(--a)", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke", class: "draw" });
const pB = el("path", { d: line(sB), fill: "none", stroke: "var(--b)", "stroke-width": 2, "stroke-dasharray": "5 4", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke", opacity: ".9" });
svg.append(pB, pA);
pA.style.setProperty("--len", pA.getTotalLength());

const cross = el("line", { y1: P.t, y2: H - P.b, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0, "vector-effect": "non-scaling-stroke" });
const dotA = el("circle", { r: 4, fill: "var(--a)", stroke: "var(--panel)", "stroke-width": 2, opacity: 0 });
const dotB = el("circle", { r: 3.5, fill: "var(--b)", stroke: "var(--panel)", "stroke-width": 2, opacity: 0 });
svg.append(cross, dotB, dotA);

const tip = document.getElementById("tip");
const hit = el("rect", { x: P.l, y: P.t, width: W - P.l - P.r, height: H - P.t - P.b, fill: "transparent" });
svg.append(hit);

hit.addEventListener("pointermove", (ev) => {
  const box = svg.getBoundingClientRect();
  const px = ((ev.clientX - box.left) / box.width) * W;
  const i = Math.max(0, Math.min(months.length - 1, Math.round(((px - P.l) / (W - P.l - P.r)) * (months.length - 1))));
  cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
  dotA.setAttribute("cx", x(i)); dotA.setAttribute("cy", y(sA[i])); dotA.setAttribute("opacity", 1);
  dotB.setAttribute("cx", x(i)); dotB.setAttribute("cy", y(sB[i])); dotB.setAttribute("opacity", 1);
  tip.innerHTML = `<b>${months[i]}</b>
    <div class="row"><span style="color:var(--a)">●</span><span>访问量</span><span>${sA[i]}k</span></div>
    <div class="row"><span style="color:var(--b)">●</span><span>独立访客</span><span>${sB[i]}k</span></div>`;
  tip.style.opacity = 1;
  tip.style.left = (x(i) / W) * box.width + "px";
  tip.style.top = (y(sA[i]) / H) * box.height + "px";
});
hit.addEventListener("pointerleave", () => {
  tip.style.opacity = 0;
  cross.setAttribute("opacity", 0); dotA.setAttribute("opacity", 0); dotB.setAttribute("opacity", 0);
});
document.getElementById("lineHost").append(svg);

/* ---------- 环形图 ---------- */
const donut = [
  { name: "直接访问", v: 4820, c: "var(--a)" },
  { name: "搜索引擎", v: 3140, c: "var(--a-2)" },
  { name: "社交媒体", v: 1980, c: "var(--b)" },
  { name: "外部推荐", v: 1260, c: "var(--c)" },
  { name: "其他", v: 620, c: "var(--d)" },
];
const total = donut.reduce((s, d) => s + d.v, 0);
const R = 44, TH = 13, GAP = 2.4;
const polar = (r, deg) => { const a = ((deg - 90) * Math.PI) / 180; return [60 + r * Math.cos(a), 60 + r * Math.sin(a)]; };
const rings = document.getElementById("rings");
let acc = 0;
donut.forEach((d, i) => {
  const sweep = (d.v / total) * 360;
  const s = acc + GAP / 2, e = acc + sweep - GAP / 2;
  acc += sweep;
  const [x1, y1] = polar(R, s), [x2, y2] = polar(R, e);
  const arc = el("path", { d: `M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${e - s > 180 ? 1 : 0} 1 ${x2.toFixed(2)},${y2.toFixed(2)}`, fill: "none", stroke: d.c, "stroke-width": TH, "stroke-linecap": "round", class: "ring" });
  const title = el("title");
  title.textContent = `${d.name} ${((d.v / total) * 100).toFixed(1)}%`;
  arc.append(title);
  rings.append(arc);
  const len = arc.getTotalLength();
  arc.style.strokeDasharray = `${len}`;
  arc.style.strokeDashoffset = `${len}`;
  arc.style.transition = "stroke-dashoffset .9s cubic-bezier(.4,0,.2,1), transform .2s ease";
  arc.style.transitionDelay = `${i * 90}ms`;
  requestAnimationFrame(() => { arc.style.strokeDashoffset = "0"; });
});

document.getElementById("donutList").innerHTML = donut.map((d) =>
  `<div><i style="width:9px;height:9px;border-radius:3px;display:inline-block;background:${d.c}"></i>${d.name}<b>${((d.v / total) * 100).toFixed(1)}%</b></div>`
).join("");

/* ---------- 柱状图 ---------- */
const days = ["一", "二", "三", "四", "五", "六", "日"];
const bars = [52, 86, 64, 71, 58, 33, 26];
const barHost = document.getElementById("bars");
days.forEach((d, i) => {
  const b = document.createElement("div");
  b.className = "bar";
  b.innerHTML = `<u style="height:0"></u><em>${d}</em>`;
  barHost.append(b);
});
requestAnimationFrame(() => {
  [...barHost.querySelectorAll("u")].forEach((u, i) => { u.style.height = bars[i] + "%"; });
});

const funnel = [{ n: "曝光", v: 100, c: "var(--a)" }, { n: "点击", v: 62, c: "var(--a-2)" }, { n: "加购", v: 28, c: "var(--c)" }, { n: "下单", v: 11, c: "var(--b)" }];
const fHost = document.getElementById("funnel");
funnel.forEach((f) => {
  const b = document.createElement("div");
  b.className = "bar";
  b.innerHTML = `<u style="height:0;background:linear-gradient(180deg,${f.c},color-mix(in srgb,${f.c} 45%,transparent))"></u><em>${f.n}</em>`;
  fHost.append(b);
});
requestAnimationFrame(() => {
  [...fHost.querySelectorAll("u")].forEach((u, i) => { u.style.height = funnel[i].v + "%"; });
});

/* ---------- 数字滚动 ---------- */
document.querySelectorAll("[data-count]").forEach((node) => {
  const target = parseFloat(node.dataset.count);
  const dec = parseInt(node.dataset.dec || "0", 10);
  const suffix = node.dataset.suffix || "";
  const t0 = performance.now(), dur = 900;
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    const val = target * e;
    node.textContent = (dec || target >= 10000
      ? val.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec })
      : val.toFixed(0)) + suffix;
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
});
document.getElementById("donutTotal").textContent = total.toLocaleString("en-US");
</script>
</body>
</html>
