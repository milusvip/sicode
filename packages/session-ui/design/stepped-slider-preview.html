<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SiCode · 档位滑杆</title>
    <style>
      :root {
        --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: #060607;
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
      }

      /* ---------- window ---------- */

      .window {
        width: min(880px, 100%);
        height: min(800px, calc(100vh - 48px));
        display: flex;
        flex-direction: column;
        border-radius: 11px;
        overflow: hidden;
        background: #0d0d0f;
        color: #e9e7e4;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.075),
          0 40px 100px -30px rgba(0, 0, 0, 0.9),
          0 2px 10px rgba(0, 0, 0, 0.5);

        --bg: #0d0d0f;
        --panel: #111113;
        --raise: #161619;
        --text: #e9e7e4;
        --muted: #9c9791;
        --faint: #6c6761;
        --line: rgba(255, 255, 255, 0.075);
        --line-strong: rgba(255, 255, 255, 0.13);
        --hover: rgba(255, 255, 255, 0.045);

        --seg-off: rgba(255, 255, 255, 0.085);
        --seg-off-hi: rgba(255, 255, 255, 0.14);
        --seg-on-a: #9d968b;
        --seg-on-b: #ece6dd;
        --seg-glow: rgba(236, 230, 221, 0.28);
        --thumb: #f1ece4;
        --thumb-edge: rgba(0, 0, 0, 0.45);
        --grip: rgba(24, 22, 20, 0.42);
      }

      .window[data-theme="light"] {
        background: #fbfaf8;
        color: #171614;
        --bg: #fbfaf8;
        --panel: #f5f3f0;
        --raise: #ffffff;
        --text: #171614;
        --muted: #6b6660;
        --faint: #9a948e;
        --line: rgba(0, 0, 0, 0.085);
        --line-strong: rgba(0, 0, 0, 0.16);
        --hover: rgba(0, 0, 0, 0.04);

        --seg-off: rgba(23, 22, 20, 0.1);
        --seg-off-hi: rgba(23, 22, 20, 0.16);
        --seg-on-a: #8d867c;
        --seg-on-b: #171614;
        --seg-glow: rgba(23, 22, 20, 0.16);
        --thumb: #23211e;
        --thumb-edge: rgba(255, 255, 255, 0.12);
        --grip: rgba(255, 255, 255, 0.55);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.1),
          0 30px 80px -34px rgba(0, 0, 0, 0.5);
      }

      /* ---------- titlebar ---------- */

      .titlebar {
        flex: 0 0 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-inline: 14px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }

      .tb-left {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12.5px;
      }

      .logo {
        width: 15px;
        height: 15px;
        border-radius: 4px;
        background: linear-gradient(150deg, #6f6a63, #cfc8bd 55%, #4a4741);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      }

      .tb-title {
        color: var(--text);
        font-weight: 520;
        letter-spacing: 0.1px;
      }

      .tb-sep {
        color: var(--faint);
      }

      .tb-sub {
        color: var(--muted);
      }

      .theme-btn {
        font: inherit;
        font-size: 11.5px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 9px;
        cursor: pointer;
      }

      .theme-btn:hover {
        color: var(--text);
        background: var(--hover);
      }

      /* ---------- stage ---------- */

      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      .chat {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 26px 34px 8px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        scrollbar-width: thin;
      }

      .msg {
        display: flex;
        flex-direction: column;
        gap: 7px;
        max-width: 100%;
      }

      .msg.user {
        align-items: flex-end;
      }

      .bubble {
        max-width: 78%;
        padding: 9px 13px;
        border-radius: 13px;
        font-size: 13.5px;
        line-height: 20px;
        background: var(--raise);
        border: 1px solid var(--line);
        color: var(--text);
      }

      .msg.user .bubble {
        background: rgba(255, 255, 255, 0.055);
        border-color: transparent;
      }

      .window[data-theme="light"] .msg.user .bubble {
        background: rgba(0, 0, 0, 0.055);
      }

      .who {
        font-size: 11px;
        color: var(--faint);
        padding-inline: 3px;
      }

      .body-text {
        font-size: 13.5px;
        line-height: 21px;
        color: var(--text);
        max-width: 74ch;
      }

      .body-text code {
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
      }

      .window[data-theme="light"] .body-text code {
        background: rgba(0, 0, 0, 0.06);
      }

      .thinking {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }

      .thinking .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.55;
        animation: breathe 2.4s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 0.75;
        }
      }

      .caret {
        display: inline-block;
        width: 6px;
        height: 14px;
        margin-left: 2px;
        vertical-align: -2px;
        border-radius: 1px;
        background: var(--text);
        animation: blink 1.1s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* ---------- composer ---------- */

      .composer {
        flex: 0 0 auto;
        padding: 10px 34px 18px;
      }

      .composer-box {
        border: 1px solid var(--line-strong);
        border-radius: 13px;
        background: var(--panel);
        box-shadow: 0 8px 24px -18px rgba(0, 0, 0, 0.9);
      }

      .composer-box:focus-within {
        border-color: rgba(255, 255, 255, 0.22);
      }

      .window[data-theme="light"] .composer-box:focus-within {
        border-color: rgba(0, 0, 0, 0.26);
      }

      .field {
        padding: 12px 14px 6px;
        font-size: 13.5px;
        line-height: 20px;
        color: var(--faint);
        min-height: 46px;
        outline: none;
        user-select: none;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 4px 10px 9px;
      }

      .bar-left {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border-radius: 7px;
        font-size: 11.5px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
      }

      .chip svg {
        width: 12px;
        height: 12px;
        opacity: 0.75;
      }

      .send {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: var(--text);
        color: var(--bg);
        cursor: pointer;
      }

      .send svg {
        width: 14px;
        height: 14px;
      }

      /* ---------- thinking dial (弹出面板) ---------- */

      .think {
        position: relative;
        display: inline-flex;
      }

      .trigger {
        font: inherit;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 11.5px;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
        transition:
          color 140ms ease,
          background 140ms ease,
          border-color 140ms ease;
      }

      .trigger:hover {
        color: var(--text);
        background: var(--hover);
      }

      .trigger[aria-expanded="true"] {
        color: var(--text);
        border-color: var(--line-strong);
        background: var(--hover);
      }

      .trigger svg {
        width: 12px;
        height: 12px;
        opacity: 0.8;
      }

      .trigger .tr-sep {
        color: var(--faint);
      }

      .trigger .tr-value {
        color: var(--text);
        font-weight: 520;
      }

      .dial {
        position: absolute;
        z-index: 20;
        left: 0;
        bottom: calc(100% + 9px);
        width: 322px;
        padding: 12px 13px 11px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--raise);
        box-shadow:
          0 20px 48px -20px rgba(0, 0, 0, 0.85),
          0 2px 8px rgba(0, 0, 0, 0.35);
        transform-origin: bottom left;
        opacity: 0;
        visibility: hidden;
        transform: translateY(6px) scale(0.985);
        transition:
          opacity 150ms ease,
          transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
          visibility 0s linear 180ms;
      }

      .window[data-theme="light"] .dial {
        background: #ffffff;
        box-shadow:
          0 20px 44px -22px rgba(0, 0, 0, 0.4),
          0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .dial.open {
        opacity: 1;
        visibility: visible;
        transform: none;
        transition:
          opacity 150ms ease,
          transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .dial-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .dial-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dial-name {
        font-size: 11px;
        letter-spacing: 0.35px;
        color: var(--faint);
        text-transform: uppercase;
      }

      .dial-read {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }

      .dial-desc {
        font-size: 11.5px;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dial-value {
        font-size: 12px;
        font-weight: 560;
        color: var(--text);
        letter-spacing: 0.2px;
        min-width: 2em;
        text-align: right;
      }

      .rail {
        position: relative;
        height: 30px;
        margin-inline: 9px;
        cursor: pointer;
        touch-action: none;
        outline: none;
      }

      .groove {
        position: absolute;
        inset-inline: 0;
        top: 50%;
        height: 7px;
        margin-top: -3.5px;
        border-radius: 4px;
        background: var(--seg-off);
        box-shadow: inset 0 1px 0 var(--seg-off-hi);
      }

      .fill {
        position: absolute;
        inset-inline-start: 0;
        top: 50%;
        height: 7px;
        width: 50%;
        margin-top: -3.5px;
        border-radius: 4px;
        background: linear-gradient(180deg, var(--seg-on-b), var(--seg-on-a));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
        will-change: width;
      }

      .fill::after {
        content: "";
        position: absolute;
        top: -6px;
        bottom: -6px;
        inset-inline-end: -7px;
        width: 18px;
        border-radius: 999px;
        background: radial-gradient(closest-side, var(--seg-glow), transparent);
        opacity: 0;
        transition: opacity 220ms ease;
        pointer-events: none;
      }

      .rail.moving .fill::after {
        opacity: 1;
      }

      .thumb {
        position: absolute;
        top: 50%;
        inset-inline-start: 50%;
        width: 17px;
        height: 26px;
        transform: translate(-50%, -50%);
        border-radius: 6px;
        background: var(--thumb);
        box-shadow:
          0 0 0 1px var(--thumb-edge),
          0 2px 5px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        cursor: ew-resize;
        transition:
          transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 180ms ease;
        will-change: transform;
      }

      .window[data-theme="light"] .thumb {
        box-shadow:
          0 0 0 1px var(--thumb-edge),
          0 2px 5px rgba(0, 0, 0, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
      }

      .thumb i {
        display: block;
        width: 5px;
        height: 1px;
        border-radius: 1px;
        background: var(--grip);
      }

      .rail:hover .thumb {
        transform: translate(-50%, -50%) scaleX(1.06);
      }

      .rail.moving .thumb {
        transform: translate(-50%, -50%) scaleX(1.16);
      }

      .rail:focus-visible .thumb {
        box-shadow:
          0 0 0 1px var(--thumb-edge),
          0 0 0 4px var(--seg-glow);
      }

      .scale {
        position: relative;
        height: 7px;
        margin: 6px 9px 0;
      }

      .scale i {
        position: absolute;
        top: 0;
        width: 1px;
        height: 4px;
        border-radius: 1px;
        background: var(--line-strong);
        transform: translateX(-50%);
        opacity: 0.6;
        transition:
          opacity 160ms ease,
          height 160ms ease,
          background 160ms ease;
      }

      .scale i.on {
        height: 7px;
        opacity: 1;
        background: var(--muted);
      }

      .dial-labels {
        position: relative;
        height: 15px;
        margin: 0 9px;
      }

      .dial-labels span {
        position: absolute;
        top: 0;
        font-size: 10.5px;
        line-height: 15px;
        color: var(--faint);
        transform: translateX(-50%);
        transition: color 160ms ease;
        user-select: none;
        white-space: nowrap;
      }

      .dial-labels span.on {
        color: var(--text);
        font-weight: 520;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="window" id="win">
      <div class="titlebar">
        <div class="tb-left">
          <div class="logo"></div>
          <span class="tb-title">SiCode</span>
          <span class="tb-sep">/</span>
          <span class="tb-sub">对话 · 思考强度</span>
        </div>
        <button class="theme-btn" id="themeBtn">浅色</button>
      </div>

      <div class="stage">
        <div class="chat">
          <div class="msg user">
            <div class="bubble">拖动的时候自动吸到最近的档，别让我停在半档上。</div>
          </div>

          <div class="msg">
            <div class="who">SiCode</div>
            <div class="thinking"><span class="dot"></span>思考 9s · 中</div>
            <div class="body-text">
              改好了：拖动会自动吸到最近的档位，是滑过去而不是硬跳，所以既跟手也不含糊。开关也去掉了，永远吸附。
            </div>
          </div>

          <div class="msg user">
            <div class="bubble">但它别老占着输入框下面。</div>
          </div>

          <div class="msg">
            <div class="who">SiCode</div>
            <div class="body-text">
              那就收起来——点下面的「思考 · 中」才展开，点面板外面或者按 Esc 就收起。
              <span class="caret"></span>
            </div>
          </div>
        </div>

        <div class="composer">
          <div class="composer-box">
            <div class="field">问点什么，或者把代码贴进来…</div>

            <div class="bar">
              <div class="bar-left">
                <span class="chip">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                    <path d="M8 2v12M2 8h12" stroke-linecap="round" />
                  </svg>
                  附加
                </span>
                <span class="chip">claude-sonnet-4.5</span>

                <div class="think">
                  <button
                    class="trigger"
                    id="trigBtn"
                    aria-haspopup="true"
                    aria-expanded="false"
                    aria-controls="dial"
                  >
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                      <path d="M8 2.5 9.4 6.6 13.5 8 9.4 9.4 8 13.5 6.6 9.4 2.5 8 6.6 6.6Z" stroke-linejoin="round" />
                    </svg>
                    思考
                    <span class="tr-sep">·</span>
                    <span class="tr-value" id="trigValue">中</span>
                  </button>

                  <div class="dial" id="dial" inert>
                    <div class="dial-head">
                      <div class="dial-left">
                        <span class="dial-name">思考强度</span>
                      </div>
                      <div class="dial-read">
                        <span class="dial-desc" id="desc">速度与深度兼顾</span>
                        <span class="dial-value" id="value">中</span>
                      </div>
                    </div>

                    <div
                      class="rail"
                      id="rail"
                      role="slider"
                      tabindex="0"
                      aria-label="思考强度"
                      aria-valuemin="0"
                      aria-valuemax="4"
                      aria-valuenow="2"
                      aria-valuetext="中"
                    >
                      <div class="groove"></div>
                      <div class="fill" id="fill"></div>
                      <div class="thumb" id="thumb"><i></i><i></i><i></i></div>
                    </div>

                    <div class="scale" id="scale" aria-hidden="true"></div>
                    <div class="dial-labels" id="labels"></div>
                  </div>
                </div>
              </div>
              <button class="send" aria-label="发送">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                  <path d="M8 12.5V3.5M4 7l4-3.5L12 7" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const LEVELS = [
        { name: "关", desc: "不思考，直接作答" },
        { name: "低", desc: "快速权衡一遍" },
        { name: "中", desc: "速度与深度兼顾" },
        { name: "高", desc: "多步推演后再落笔" },
        { name: "极高", desc: "穷尽验证，明显更慢" },
      ]

      const MAX = LEVELS.length - 1
      const TICKS = 9
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)")

      const rail = document.getElementById("rail")
      const thumb = document.getElementById("thumb")
      const fill = document.getElementById("fill")
      const scale = document.getElementById("scale")
      const labelBox = document.getElementById("labels")
      const valueEl = document.getElementById("value")
      const descEl = document.getElementById("desc")
      const trigBtn = document.getElementById("trigBtn")
      const trigValue = document.getElementById("trigValue")
      const dial = document.getElementById("dial")

      scale.innerHTML = Array.from(
        { length: TICKS },
        (_, i) => `<i style="inset-inline-start:${(i / (TICKS - 1)) * 100}%"></i>`,
      ).join("")
      labelBox.innerHTML = LEVELS.map(
        (level, i) => `<span style="inset-inline-start:${(i / MAX) * 100}%">${level.name}</span>`,
      ).join("")

      const tickEls = [...scale.children]
      const labelEls = [...labelBox.children]

      let value = 2 // 当前显示值，缓动后落在整数档
      let target = 2 // 目标档位，永远是整数
      let dragging = false
      let frame = 0
      let last = 0
      let painted = -1

      const clamp = (n) => Math.max(0, Math.min(MAX, n))

      function render() {
        const pct = (value / MAX) * 100
        thumb.style.insetInlineStart = pct + "%"
        fill.style.width = pct + "%"
      }

      function paint() {
        const level = Math.round(value)
        if (level === painted) return
        painted = level
        labelEls.forEach((el, i) => el.classList.toggle("on", i === level))
        tickEls.forEach((el, i) => el.classList.toggle("on", i === level * 2))
        valueEl.textContent = LEVELS[level].name
        descEl.textContent = LEVELS[level].desc
        trigValue.textContent = LEVELS[level].name
        rail.setAttribute("aria-valuenow", String(level))
        rail.setAttribute("aria-valuetext", LEVELS[level].name)
        if (!dragging) {
          valueEl.animate(
            [
              { opacity: 0, transform: "translateY(4px)" },
              { opacity: 1, transform: "none" },
            ],
            { duration: 170, easing: "cubic-bezier(.2,.8,.2,1)" },
          )
        }
      }

      function tick(now) {
        frame = 0
        const dt = last ? now - last : 16
        last = now
        value += (target - value) * (reduceMotion.matches ? 1 : 1 - Math.exp(-dt / (dragging ? 55 : 110)))
        if (Math.abs(target - value) < 0.0008) value = target
        render()
        paint()
        if (value !== target) frame = requestAnimationFrame(tick)
        else last = 0
      }

      function move(next, immediate) {
        target = clamp(next)
        if (immediate || reduceMotion.matches) {
          value = target
          render()
          paint()
          return
        }
        if (!frame) frame = requestAnimationFrame(tick)
      }

      function aim(clientX) {
        const rect = rail.getBoundingClientRect()
        const next = clamp((clientX - rect.left) / rect.width) * MAX
        move(Math.round(next))
      }

      rail.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return
        dragging = true
        rail.classList.add("moving")
        rail.setPointerCapture(event.pointerId)
        rail.focus({ preventScroll: true })
        aim(event.clientX)
      })

      rail.addEventListener("pointermove", (event) => {
        if (dragging) aim(event.clientX)
      })

      const release = () => {
        if (!dragging) return
        dragging = false
        rail.classList.remove("moving")
      }

      rail.addEventListener("pointerup", release)
      rail.addEventListener("pointercancel", release)
      rail.addEventListener("lostpointercapture", release)

      rail.addEventListener("keydown", (event) => {
        const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[event.key]
        if (step) {
          event.preventDefault()
          move(Math.round(target) + step)
          return
        }
        if (event.key !== "Home" && event.key !== "End") return
        event.preventDefault()
        move(event.key === "Home" ? 0 : MAX)
      })

      function setOpen(open) {
        trigBtn.setAttribute("aria-expanded", String(open))
        dial.classList.toggle("open", open)
        dial.inert = !open
        if (open) rail.focus({ preventScroll: true })
      }

      trigBtn.addEventListener("click", () => setOpen(trigBtn.getAttribute("aria-expanded") !== "true"))

      document.addEventListener("pointerdown", (event) => {
        if (trigBtn.getAttribute("aria-expanded") !== "true") return
        if (event.target.closest(".think")) return
        setOpen(false)
      })

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return
        if (trigBtn.getAttribute("aria-expanded") !== "true") return
        event.preventDefault()
        setOpen(false)
        trigBtn.focus({ preventScroll: true })
      })

      render()
      paint()

      document.getElementById("themeBtn").addEventListener("click", (event) => {
        const win = document.getElementById("win")
        const light = win.dataset.theme === "light"
        win.dataset.theme = light ? "" : "light"
        event.currentTarget.textContent = light ? "浅色" : "深色"
      })
    </script>
  </body>
</html>
