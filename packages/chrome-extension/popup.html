<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>SiCode</title>
    <style>
      :root {
        --bg: #f8f8f8;
        --surface: #ffffff;
        --text: #171717;
        --muted: #6f6f6f;
        --weak: #8f8f8f;
        --border: #e5e5e5;
        --primary: #171717;
        --primary-text: #fcfcfc;
        --brand: #dcde8d;
        --ok: #2dba26;
        --warn: #b8860b;
        --bad: #ed4831;
        --radius: 10px;
        --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 300px;
        color: var(--text);
        background: var(--bg);
        font: 13px/1.45 var(--font);
      }

      .shell {
        padding: 12px;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .logo {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        flex: 0 0 auto;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      .titles {
        min-width: 0;
        flex: 1;
      }

      .title {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .lang {
        display: grid;
        grid-template-columns: 32px 32px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        overflow: hidden;
        flex: 0 0 auto;
      }

      .lang button {
        border: 0;
        margin: 0;
        padding: 0;
        width: 32px;
        height: 26px;
        background: transparent;
        color: var(--muted);
        font: 11px/26px var(--font);
        cursor: pointer;
        text-align: center;
      }

      .lang button[aria-pressed="true"] {
        background: var(--primary);
        color: var(--primary-text);
      }

      .brand-bar {
        height: 3px;
        margin: 0 0 8px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--brand), #f0f1c4 55%, transparent);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: var(--weak);
      }

      .status[data-state="connected"] .dot {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(45, 186, 38, 0.18);
      }

      .status[data-state="connecting"] .dot,
      .status[data-state="pairing"] .dot,
      .status[data-update="true"] .dot {
        background: var(--warn);
        box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.2);
      }

      .status[data-state="disconnected"] .dot,
      .status[data-state="paused"] .dot,
      .status[data-state="disabled"] .dot {
        background: var(--bad);
        box-shadow: none;
      }

      .status-text {
        font-size: 12px;
        font-weight: 600;
      }

      .status-version {
        margin-left: auto;
        /* The version is the one thing in this row that must never be squeezed away. */
        flex: none;
        color: var(--muted, #8b8b8b);
        font: 500 10px/1.3 var(--font);
      }

      .status-detail {
        margin-left: auto;
        color: var(--weak);
        font-size: 11px;
      }

      .hint {
        margin: 8px 2px 0;
        color: var(--weak);
        font-size: 11px;
        line-height: 1.4;
      }

      .update {
        display: none;
        margin-bottom: 8px;
        padding: 8px 10px;
        border: 1px solid #edd9a3;
        border-radius: var(--radius);
        background: #fff8e8;
        color: #7a5a10;
        font-size: 11px;
        line-height: 1.45;
      }

      .update[data-show="true"] {
        display: block;
      }

      .update strong {
        display: block;
        margin-bottom: 2px;
        font-size: 12px;
        font-weight: 650;
        color: #5c4308;
      }

      .update-open {
        margin-top: 6px;
        width: 100%;
        border: 1px solid #d9c48a;
        border-radius: 7px;
        padding: 6px 10px;
        background: #fff;
        color: #5c4308;
        font: 600 11px/1.3 var(--font);
        cursor: pointer;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .push,
      .pick-element,
      .copy-login {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;
        font: 600 12px/1.3 var(--font);
        cursor: pointer;
      }

      .push {
        background: var(--primary);
        color: var(--primary-text);
      }

      .pick-element,
      .copy-login {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }

      .push:disabled,
      .pick-element:disabled,
      .copy-login:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .push-feedback {
        color: var(--muted);
        font-size: 11px;
        text-align: center;
        line-height: 1.3;
      }

      .push-feedback:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="head">
        <img class="logo" src="icons/icon48.png" width="36" height="36" alt="SiCode" />
        <div class="titles">
          <div class="title" data-i18n="title">SiCode 浏览器桥接</div>
          <div class="subtitle" data-i18n="subtitle">连接桌面端 Agent</div>
        </div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="lang-zh" data-locale="zh" aria-pressed="true">中</button>
          <button type="button" id="lang-en" data-locale="en" aria-pressed="false">EN</button>
        </div>
      </div>

      <div class="brand-bar" aria-hidden="true"></div>

      <div class="status" id="status" data-state="disconnected">
        <span class="dot" aria-hidden="true"></span>
        <span class="status-text" id="status-text">未连接</span>
        <span class="status-detail" id="status-detail"></span>
        <span class="status-version" id="version" dir="ltr"></span>
      </div>

      <div class="update" id="update" data-show="false" role="status">
        <strong data-i18n="update_title">需要更新扩展</strong>
        <span data-i18n="update_body">桌面端已带新版本。请先移除本扩展，再在 SiCode「设置 → 浏览器」安装并添加。</span>
        <button type="button" class="update-open" id="update-open" data-i18n="update_open">打开扩展管理页</button>
      </div>

      <div class="actions">
        <button type="button" class="push" id="push-tab" data-i18n="push">推送到对话</button>
        <button type="button" class="pick-element" id="pick-element" data-i18n="pick">选元素推送</button>
        <button type="button" class="copy-login" id="copy-login" data-i18n="copy_login">复制登录态</button>
        <button type="button" class="copy-login" id="sync-login" data-i18n="sync_login">同步登录态到内置浏览器</button>
        <div class="push-feedback" id="push-feedback" aria-live="polite"></div>
      </div>

      <p class="hint" data-i18n="hint">推送后 Agent 用系统 Chrome，无需 @。也可右键推送 / 选元素。复制登录态可贴到内置浏览器「导入会话」。</p>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
